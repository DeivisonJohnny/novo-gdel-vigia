server {
    listen 80;
    server_name vigia.exemplo.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vigia.exemplo.com.br;

    ssl_certificate /etc/letsencrypt/live/vigia.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigia.exemplo.com.br/privkey.pem;

    client_max_body_size 1m;

    location ~ ^/api/(auth|usuarios) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(eventos|cameras/[^/]+/(deteccoes|mjpeg))$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
