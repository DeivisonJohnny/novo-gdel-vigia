services:
  roteador:
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    container_name: vigia-roteador-dev
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    ports:
      - "1935:1935"
      - "8554:8554"
      - "8189:8189/udp"
      - "8190:8190"
      - "9996:9996"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./gravacoes:/gravacoes
    ulimits:
      core: 0
